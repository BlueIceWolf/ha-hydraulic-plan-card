name: Seed visual references (temporary)

on:
  push:
    branches: [qa/close-remaining-acceptance-20261109]

permissions:
  contents: write

jobs:
  create-baselines:
    name: Generate browser screenshot baselines
    if: github.ref == 'refs/heads/qa/close-remaining-acceptance-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/close-remaining-acceptance-20261109
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Generate reviewed test-case image references
        run: npx playwright test test/visual-acceptance.spec.mjs --update-snapshots
      - name: Commit golden images once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/visual-acceptance.spec.mjs-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "test: record reference screenshots for six heating plants"
            git push origin HEAD:qa/close-remaining-acceptance-20261109
          fi
