<!doctype html>
<html lang="de"><meta charset="utf-8"><title>Migration regression</title>
<pre id="result">RUNNING</pre><pre id="log"></pre>
<script>
const HFC_EMITTERS=['radiator','underfloor','column'];
const HFC_UNIT_STYLES=['auto','generic','lambda','vaillant','panasonic','viessmann',
  'bosch','saunier','samsung','wolf','kronoterm','alpha_innotec','stiebel'];
const HFC_UNIT_SIZES=['small','medium','large'];
</script>
<script src="../src/flexible-plan.js"></script>
<script src="../src/migration.js"></script>
<script src="fixtures/migration-cases.js"></script>
<script>
const log=[],check=(ok,title)=>{log.push((ok?'OK ':'FAIL ')+title);return !!ok};
let pass=true;
const original={type:'custom:hydraulic-plan-card',title:'Altbestand',plan:{
 components:[
  {id:'puffer_1',type:'buffer',name:'Puffer',sensors:{top:'sensor.puffer_top'}},
  {id:'ww_1',type:'dhw_tank',name:'Warmwasser',options:{connection_style:'branch'},sensors:{top:'sensor.ww_top'}},
  {id:'lade_1',type:'pump',name:'Ladepumpe',sensors:{state:'switch.ww_ladepumpe'},discovery:{provider:'eta-system',id:'buffer:eta:1'}}
 ],
 connections:[
  {id:'leitung_2',from:'puffer_1',from_port:'top_out',to:'lade_1',to_port:'in'},
  {id:'leitung_3',from:'lade_1',from_port:'out',to:'ww_1',to_port:'coil_in'},
  {id:'leitung_1',from:'ww_1',from_port:'coil_out',to:'puffer_1',to_port:'return_in',
   flow_entity:'switch.ww_ladepumpe',temperature_entity:'sensor.ww_return'}]}};
const before=JSON.stringify(original);
const migrated=HPC_MIGRATION.upgrade(original);
pass=check(migrated.changed&&migrated.config.hpc_schema_version===3,'versions migration')&&pass;
pass=check(JSON.stringify(original)===before,'source is not mutated')&&pass;
pass=check(migrated.config.plan.components[2].discovery?.provider==='eta-system','ETA discovery retained')&&pass;
pass=check(migrated.config.plan.connections[2].to_port==='bottom_in','legacy return maps to the consumer buffer port')&&pass;
pass=check(migrated.config.plan.connections[2].flow_entity==='switch.ww_ladepumpe','pipe signal retained')&&pass;
pass=check(migrated.config.plan.connections[2].temperature_entity==='sensor.ww_return','pipe temperature retained')&&pass;
pass=check(!HPC_MIGRATION.upgrade(migrated.config).changed,'idempotence')&&pass;
const restored=HPC_MIGRATION.restore(migrated.config);
pass=check(restored.hpc_migration_skip_auto&&restored.plan.connections[2].to_port==='return_in','rollback restores old graph')&&pass;
pass=check(!HPC_MIGRATION.upgrade(restored).changed,'restored graph not immediately overwritten')&&pass;
const unknown=structuredClone(original);unknown.plan.components.push({id:'unknown_1',type:'future_pump'});
pass=check(HPC_MIGRATION.upgrade(unknown).blocked,'unknown types block')&&pass;
const tooMany=structuredClone(original);tooMany.plan.components[0].level_sensors=Array.from({length:25},(_,i)=>({position:i,entity:'sensor.level'}));
pass=check(HPC_MIGRATION.upgrade(tooMany).blocked,'too many sensors block')&&pass;
const classic=HPC_MIGRATION.upgrade({generator_type:'oil',hc_count:2,
 entities:{boiler_flow:'sensor.oel_vl',buffer_top:'sensor.puffer_top',hc_pump:'switch.hk1'}},{classic:true});
pass=check(classic.changed&&classic.config.plan.components.some(c=>c.type==='oil_boiler'),'classic boiler import')&&pass;
pass=check(classic.config.plan.components.filter(c=>c.type==='heating_circuit').length===2,'classic circuits import')&&pass;
pass=check(classic.config.plan.connections.length===0&&classic.warnings.length>0,'no invented pipes')&&pass;
pass=check(!!classic.config.hpc_migration_backup,'classic snapshot exists')&&pass;

const extra=structuredClone(original);
extra.plan.components[0].sensors.custom_extension='sensor.temperatur_extra';
extra.plan.components[0].options={future_setting:'retain_this'};
extra.plan.components[0].plugin_data={notes:'Leave this intact'};
extra.plan.connections[0].future_style='compat';
const extraResult=HPC_MIGRATION.upgrade(extra);
pass=check(extraResult.blocked===true,'unknown sensor or options block unreviewed migration')&&pass;
pass=check(HPC_FREE.normalize(extra.plan).components[0].sensors.custom_extension==='sensor.temperatur_extra'&&
  HPC_FREE.normalize(extra.plan).components[0].options.future_setting==='retain_this'&&
  HPC_FREE.normalize(extra.plan).components[0].plugin_data.notes==='Leave this intact'&&
  HPC_FREE.normalize(extra.plan).connections[0].future_style==='compat',
  'unknown extension fields survive normalization')&&pass;
const ambiguous=structuredClone(original);
ambiguous.plan.connections=ambiguous.plan.connections.filter(e=>e.to_port!=='coil_in');
pass=check(HPC_MIGRATION.upgrade(ambiguous).blocked,'partial DHW coil blocks migration')&&pass;
const schema2=structuredClone(original);schema2.hpc_schema_version=2;
const v2=HPC_MIGRATION.upgrade(schema2);
pass=check(v2.changed&&v2.config.hpc_schema_version===3&&
  !!v2.config.hpc_migration_backup,'v2 upgrades to v3 with snapshot')&&pass;
pass=check(!HPC_MIGRATION.upgrade(v2.config).changed,'v3 remains idempotent')&&pass;
const future=structuredClone(original);future.hpc_schema_version=4;
pass=check(!HPC_MIGRATION.upgrade(future).changed,'future schema is never downgraded')&&pass;
const reversed=structuredClone(original);
reversed.plan.connections=[{id:'wrong_direction',from:'puffer_1',from_port:'top_in',
  to:'ww_1',to_port:'coil_out'}];
pass=check(HPC_MIGRATION.check(reversed.plan).length>0,
  'reversed hydraulic port direction blocks migration')&&pass;
pass=check(HPC_FREE.normalize(reversed.plan).connections.length===0,
  'normalization does not preserve hydraulically reversed pipes')&&pass;
const futureNode=structuredClone(v2.config);
futureNode.plan.components.push({id:'unknown_future',type:'future_valve',name:'Neues Bauteil'});
const unchangedFuture=JSON.stringify(futureNode);
const guarded=HPC_MIGRATION.upgrade(futureNode);
pass=check(!guarded.changed&&guarded.warnings.length>0&&
  JSON.stringify(futureNode)===unchangedFuture,
  'v3 unknown extension is reported without modifying original config')&&pass;

const mixedIds=structuredClone(original);
mixedIds.plan.extensions={futureRouter:{grouping:'kept'}};
mixedIds.plan.components[0].id='BufferA';
mixedIds.plan.components[1].id='HotWaterB';
mixedIds.plan.components[2].id='ChargePumpC';
mixedIds.plan.connections[0].id='flowSupply1';
mixedIds.plan.connections[0].from='BufferA';
mixedIds.plan.connections[0].to='ChargePumpC';
mixedIds.plan.connections[1].id='flowSupply2';
mixedIds.plan.connections[1].from='ChargePumpC';
mixedIds.plan.connections[1].to='HotWaterB';
mixedIds.plan.connections[2].id='returnLine1';
mixedIds.plan.connections[2].from='HotWaterB';
mixedIds.plan.connections[2].to='BufferA';
const mixedMigrated=HPC_MIGRATION.upgrade(mixedIds);
pass=check(mixedMigrated.changed&&
  mixedMigrated.config.plan.components.length===3&&
  mixedMigrated.config.plan.connections.length===3&&
  mixedMigrated.config.plan.connections[2].id==='returnLine1',
  'mixed-case legacy component and pipe identifiers retain all connections')&&pass;
pass=check(mixedMigrated.config.plan.extensions?.futureRouter?.grouping==='kept'&&
  HPC_MIGRATION.restore(mixedMigrated.config).plan.extensions?.futureRouter?.grouping==='kept',
  'future plan-level metadata survives upgrade and restore')&&pass;

for(const fixture of HPC_MIGRATION_CASES){
  const before=JSON.stringify(fixture.config);
  const result=HPC_MIGRATION.upgrade(fixture.config,{classic:fixture.classic===true});
  if(fixture.expected==='upgrade'||fixture.expected==='classic'){
    pass=check(result.changed&&!result.blocked,
      fixture.name+': migration runs without blocking')&&pass;
    pass=check(JSON.stringify(fixture.config)===before,
      fixture.name+': input fixture is not mutated')&&pass;
    pass=check(JSON.stringify(result.config.hpc_migration_backup)===before,
      fixture.name+': complete original backup is retained')&&pass;
    const saved=JSON.parse(JSON.stringify(result.config));
    const repeated=HPC_MIGRATION.upgrade(saved);
    pass=check(!repeated.changed,
      fixture.name+': a serialized and reloaded migration is idempotent')&&pass;
    const restoredCase=HPC_MIGRATION.restore(saved);
    const restoredExpected=JSON.parse(before);
    restoredExpected.hpc_migration_skip_auto=true;
    pass=check(JSON.stringify(restoredCase)===JSON.stringify(restoredExpected),
      fixture.name+': restore reproduces the original serialized configuration')&&pass;
  }else if(fixture.expected==='unchanged'){
    pass=check(!result.changed&&!result.blocked,
      fixture.name+': current schema remains unchanged')&&pass;
  }else if(fixture.expected==='future'){
    pass=check(!result.changed&&result.warnings.length>0&&
      JSON.stringify(result.config)===before,
      fixture.name+': newer schema is warned about but never rewritten')&&pass;
  }else if(fixture.expected==='blocked'){
    pass=check(!result.changed&&result.blocked&&
      JSON.stringify(result.config)===before,
      fixture.name+': ambiguous coil is blocked without touching source data')&&pass;
  }
}

document.querySelector('#result').textContent=pass?'PASS':'FAIL';
document.querySelector('#log').textContent=log.join('\n');
</script></html>
