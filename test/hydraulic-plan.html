<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Hydraulic Plan Card regression test</title></head>
<body>
<pre id="result">RUNNING</pre><pre id="log"></pre>
<!-- Testing both scripts simultaneously verifies independence from the upstream card. -->
<script src="fixtures/heatpump-hydraulic-card.js"></script>
<script src="../dist/ha-hydraulic-plan-card.js"></script>
<script>
(async () => {
  const messages = [], failures = [];
  const check = (condition, name) => {
    messages.push((condition ? 'OK: ' : 'FAIL: ') + name);
    if (!condition) failures.push(name);
  };
  const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
  const state = (id, value, unit) => ({
    entity_id: id,
    state: String(value),
    attributes: unit ? { unit_of_measurement: unit } : {},
    last_changed: new Date().toISOString(),
    last_updated: new Date().toISOString(),
  });
  const ids = {
    burning: 'binary_sensor.boiler_burning',
    flow: 'sensor.boiler_flow',
    ret: 'sensor.boiler_return',
    flue: 'sensor.boiler_flue',
    oxygen: 'sensor.boiler_o2',
    fan: 'sensor.boiler_fan',
    pump: 'switch.boiler_loading_pump',
    mixer: 'sensor.boiler_mixer_position',
    heater: 'sensor.boiler_heater',
    bufTop: 'sensor.buffer_top',
    bufMid: 'sensor.buffer_mid',
    bufBottom: 'sensor.buffer_bottom',
  };
  const boilerEntities = {
    boiler_state: ids.burning, boiler_flow: ids.flow, boiler_return: ids.ret,
    boiler_exhaust: ids.flue, boiler_o2: ids.oxygen, boiler_fan: ids.fan,
    boiler_pump: ids.pump, boiler_mixer: ids.mixer, boiler_heater: ids.heater,
    buffer_top: ids.bufTop, buffer_middle: ids.bufMid, buffer_bottom: ids.bufBottom,
  };
  const states = {
    [ids.burning]: state(ids.burning, 'on'),
    [ids.flow]: state(ids.flow, 78, '°C'),
    [ids.ret]: state(ids.ret, 62, '°C'),
    [ids.flue]: state(ids.flue, 166, '°C'),
    [ids.oxygen]: state(ids.oxygen, 7.1, '%'),
    [ids.fan]: state(ids.fan, 72, '%'),
    [ids.pump]: state(ids.pump, 'on'),
    [ids.mixer]: state(ids.mixer, 65, '%'),
    [ids.heater]: state(ids.heater, 0, 'W'),
    [ids.bufTop]: state(ids.bufTop, 70, '°C'),
    [ids.bufMid]: state(ids.bufMid, 50, '°C'),
    [ids.bufBottom]: state(ids.bufBottom, 35, '°C'),
  };
  const hassOf = (overrides = {}) => ({
    states: { ...states, ...overrides },
    entities: {}, devices: {}, locale: { language: 'de' },
    language: 'de', config: { version: '2026.10.4' },
    callService: () => Promise.resolve(),
    callWS: () => Promise.reject(Error('Unneeded in regression test')),
  });
  const mount = async (config, hass) => {
    const card = document.createElement('hydraulic-plan-card');
    card.setConfig(config);
    document.body.append(card);
    card.hass = hass;
    await sleep(60);
    return card;
  };
  try {
    const Original = customElements.get('heatpump-hydraulic-card');
    const Card = customElements.get('hydraulic-plan-card');
    check(!!Original && !!Card && Original !== Card, 'The original and derivative both register independently');
    check(!!customElements.get('hydraulic-plan-card-editor'), 'Derivative editor is registered');
    check(window.customCards.some((c) => c.type === 'hydraulic-plan-card'), 'HA card picker metadata exists');
    const wood = await mount({
      type: 'custom:hydraulic-plan-card', title: 'Holzheizung',
      generator_type: 'wood_gasifier', preset: 'none', power_sources: 'manual',
      buffer: true, entities: boilerEntities,
    }, hassOf());
    check(!wood._failed, 'Wood gasifier renders without runtime error');
    check(!!wood.shadowRoot.getElementById('svg'), 'Wood gasifier has a rendered hydraulic SVG');
    check(wood._parts?.boilerPrimary && !wood._parts?.boiler, 'Wood gasifier uses the primary boiler layout');
    check(!!wood.shadowRoot.getElementById('primary-boiler-art'), 'Wood gasifier drawing exists');
    check(!!wood.shadowRoot.getElementById('primary-boiler-pump'), 'Boiler loading pump drawing exists');
    check(!!wood.shadowRoot.getElementById('primary-boiler-mixer'), 'Return protection mixer drawing exists');
    check(wood._flowModel().boilerRunning && wood._flowModel().boilerHydraulicOn, 'Burning boiler and running loading pump');
    check(wood._drawerRows().some(([title, rows]) => rows.some((row) => row[0] === 'boiler_exhaust')), 'Flue gas temperature is in detail drawer');
    check(wood._drawerRows().some(([title, rows]) => rows.some((row) => row[0] === 'boiler_o2')), 'Residual oxygen is in detail drawer');
    const stopped = hassOf({ [ids.pump]: state(ids.pump, 'off') });
    wood.hass = stopped;
    await sleep(60);
    check(wood._flowModel().boilerRunning === true && wood._flowModel().boilerHydraulicOn === false,
      'A stopped loading pump blocks boiler circulation while the fire is burning');
    check(!wood.shadowRoot.getElementById('primary-boiler-pump')?.classList.contains('on'),
      'Stopped loading pump is visibly inactive');
    const oil = await mount({
      type: 'custom:hydraulic-plan-card', preset: 'none', generator_type: 'oil',
      power_sources: 'manual', entities: { ...boilerEntities, boiler_state: ids.burning },
    }, hassOf());
    check(!oil._failed && !!oil.shadowRoot.getElementById('primary-boiler-art'),
      'Oil boiler renders as the primary source');
    check(oil.shadowRoot.getElementById('svg')?.textContent.includes('Ölkessel'),
      'Oil boiler uses the German title');
    const hybrid = await mount({
      type: 'custom:hydraulic-plan-card', preset: 'none',
      generator_type: 'heat_pump', boiler_type: 'oil', boiler_name: 'Ölkessel',
      power_sources: 'manual',
      entities: { ...boilerEntities,
        compressor: 'binary_sensor.hp_compressor', power: 'sensor.hp_power',
        flow: 'sensor.hp_flow', return: 'sensor.hp_return',
      },
    }, hassOf({
      'binary_sensor.hp_compressor': state('binary_sensor.hp_compressor', 'on'),
      'sensor.hp_power': state('sensor.hp_power', 1700, 'W'),
      'sensor.hp_flow': state('sensor.hp_flow', 41, '°C'),
      'sensor.hp_return': state('sensor.hp_return', 34, '°C'),
    }));
    check(!hybrid._failed, 'Heat-pump + oil hybrid renders without errors');
    check(hybrid._parts?.boiler && !hybrid._parts?.boilerPrimary,
      'Hybrid renders a secondary boiler next to the heat pump');
    check(!!hybrid.shadowRoot.getElementById('boiler'), 'Secondary boiler exists');
    check(!!hybrid.shadowRoot.getElementById('boiler-return-mixer'), 'Secondary boiler mixer is shown');
    check(hybrid._flowModel().generatorMode === 'both', 'Hybrid mode recognizes both sources running');
    check(!!customElements.get('heatpump-hydraulic-card'), 'Original card remains registered after render');
    let invalid = false;
    try {
      const bad = document.createElement('hydraulic-plan-card');
      bad.setConfig({ generator_type: 'reactor' });
    } catch { invalid = true; }
    check(invalid, 'Invalid generator configuration is rejected');
    const Free = customElements.get('hydraulic-plan-card');
    const stub = Free.getStubConfig();
    check(Array.isArray(stub.plan.components) && !stub.plan_mode, 'New card configures components directly, without a view mode');

    const sample = [
      { id: 'holz', type: 'wood_gasifier', name: 'Fröling S3 Turbo', x: 50, y: 80,
        sensors: { state: ids.burning, flow: ids.flow, return: ids.ret } },
      { id: 'puffer1', type: 'buffer', name: 'Puffer 1', x: 380, y: 80,
        sensors: { top: ids.bufTop, middle: ids.bufMid, bottom: ids.bufBottom },
        level_sensors: [{position:25,entity:'sensor.buffer_25'}, {position:75,entity:'sensor.buffer_75'}] },
      { id: 'puffer2', type: 'buffer', name: 'Puffer 2', x: 600, y: 80 },
      { id: 'puffer3', type: 'buffer', name: 'Puffer 3', x: 820, y: 80 },
      { id: 'oel', type: 'oil_boiler', name: 'Ölkessel', x: 50, y: 350 },
      { id: 'wp', type: 'heat_pump', name: 'Wärmepumpe', x: 50, y: 540 },
      { id: 'hk1', type: 'heating_circuit', name: 'Heizkreis 1', x: 1060, y: 400 },
      { id: 'hk2', type: 'heating_circuit', name: 'Heizkreis 2', x: 1060, y: 580 },
      { id: 'heizstab', type: 'electric_heater', name: 'Heizstab', x: 460, y: 620 },
      { id: 'mischer', type: 'mixer', name: 'Heizstab-Mischer', x: 730, y: 620 },
    ];
    const edges=[
      {id:'holz_puffer',from:'holz',from_port:'flow',to:'puffer1',to_port:'top_in',
       flow_entity:ids.pump,temperature_entity:ids.flow},
      {id:'puffer_reihe',from:'puffer1',from_port:'bottom_out',to:'puffer2',to_port:'top_in',flow_entity:ids.pump,temperature_entity:ids.flow}
    ];
    const hassFree=hassOf({
      'sensor.buffer_25':state('sensor.buffer_25',65,'°C'),
      'sensor.buffer_75':state('sensor.buffer_75',42,'°C'),
    });
    const free=await mount({type:'custom:hydraulic-plan-card',
      plan:{components:sample,connections:edges}},hassFree);
    const freeSvg=free.shadowRoot.getElementById('svg');
    check(!!freeSvg, 'Original Heat Pump Hydraulic Card SVG remains the only drawing');
    check(!!freeSvg?.querySelector('#hp-box'), 'Original heat-source illustration is retained');
    check(!!freeSvg?.querySelector('rect.tank[x="520"][y="320"]'), 'Original buffer tank remains in place');
    check(!free.shadowRoot.getElementById('hpc-free-svg'), 'No second standalone hydraulic view');
    check(freeSvg?.querySelectorAll('g.hpi-component').length===6,
      'Additional boilers, buffers, heater and mixer are appended as original-style units');
    check(freeSvg?.querySelectorAll('g.hpi-link').length===2,
      'All configured pipes are drawn, including links between original components');

    const automaticBefore=freeSvg.querySelector('g[data-hpi-node="puffer2"] rect.tank')?.getAttribute('x');
    const movedInputs=sample.map((node)=>({...node,x:3210,y:4890}));
    free.setConfig({type:'custom:hydraulic-plan-card',
      plan:{components:movedInputs,connections:edges}});
    free.hass=hassFree;
    const autoAfter=free.shadowRoot.getElementById('svg')
      ?.querySelector('g[data-hpi-node="puffer2"] rect.tank')?.getAttribute('x');
    check(automaticBefore===autoAfter && !!automaticBefore,
      'Equipment auto layout ignores legacy X/Y and preserves original component positions');
    const newTank=freeSvg?.querySelector('g[data-hpi-node="puffer2"] rect.tank');
    check(!!newTank, 'Additional tanks use the original .tank drawing, not a flat node');
    const firstGradient=freeSvg?.querySelector('linearGradient[id="hpi-puffer1"]');
    check(firstGradient?.innerHTML.includes('25%') && firstGradient.innerHTML.includes('75%'),
      'Existing first tank gets the five-point temperature gradient');
    check(freeSvg?.querySelector('rect.tank[x="520"][y="320"]')?.getAttribute('fill')==='url(#hpi-puffer1)',
      'Original tank fill adopts the configurable temperature gradient');
    check(freeSvg?.querySelectorAll('g.hpi-link path.flow.on').length===2,
      'Explicitly mapped active pump animates all connected pipes');
    free.hass=hassOf({
      [ids.pump]:state(ids.pump,'off'),
      'sensor.buffer_25':state('sensor.buffer_25',65,'°C'),
      'sensor.buffer_75':state('sensor.buffer_75',42,'°C'),
    });
    check(free.shadowRoot.querySelectorAll('g.hpi-link path.flow.on').length===0,
      'A stopped pump also stops its animated extra pipe');
    const untouchedSvg=free.shadowRoot.getElementById('svg');
    free.hass=hassOf({
      'sensor.buffer_25':state('sensor.buffer_25',65,'°C'),
      'sensor.buffer_75':state('sensor.buffer_75',42,'°C'),
      'sensor.unrelated_thing':state('sensor.unrelated_thing',900,'W'),
      [ids.pump]:state(ids.pump,'off'),
    });
    check(free.shadowRoot.getElementById('svg') === untouchedSvg,
      'Unrelated HA entity changes do not rebuild the original schematic');

    // A new part must not turn a narrow editor preview into a 1:1 zoomed,
    // cropped image. The core drawing keeps its original responsive scale.
    const compact=await mount({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:sample.slice(0,1),connections:[]}},hassFree);
    compact.style.width='550px';
    const originalWidth=compact.shadowRoot.getElementById('svg').getBoundingClientRect().width;
    compact.setConfig({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:[sample[0],sample[4]],connections:[]}});
    compact.hass=hassFree;
    const compactSvg=compact.shadowRoot.getElementById('svg');
    const addedWidth=compactSvg.getBoundingClientRect().width;
    check(Math.abs(addedWidth-originalWidth)<3 &&
      compactSvg.style.width.endsWith('%'),
      'Adding an oil boiler preserves original schematic zoom in a 550px preview');
    const oilBox=compactSvg.querySelector('[data-hpi-node="oel"] rect.unit');
    check(!!oilBox&&Number(oilBox.getAttribute('x'))===50 &&
      Number(oilBox.getAttribute('y'))>=450,
      'Automatic layout puts the additional boiler below the existing source');
    compact.remove();

    const legacyEditor=document.createElement('hydraulic-plan-card-editor');
    legacyEditor.setConfig({type:'custom:hydraulic-plan-card',preset:'none',
      generator_type:'wood_gasifier',boiler_name:'Fröling S3 Turbo',
      plan:{components:[],connections:[]}});
    document.body.append(legacyEditor);
    legacyEditor.hass=hassFree;
    let addedConfig;
    legacyEditor.addEventListener('config-changed',e=>addedConfig=e.detail.config);
    const legacySelect=legacyEditor.querySelector('#hpc-free-type');
    if(legacySelect)legacySelect.value='oil_boiler';
    legacyEditor.querySelector('button[data-action="add-component"]')?.click();
    check(addedConfig?.plan?.components.length===2 &&
      addedConfig.plan.components[0].type==='wood_gasifier' &&
      addedConfig.plan.components[1].type==='oil_boiler',
      'Adding to a classic boiler schematic preserves the existing wood gasifier');
    legacyEditor.remove();

    // The oil boiler must not be shown as a generic wood-fire icon.
    check(!!oil.shadowRoot.getElementById('primary-boiler-art')?.querySelector('.hpi-primary-oil-burner'),
      'Primary oil boiler displays its own burner and control cabinet');
    const addedOil=free.shadowRoot.querySelector('[data-hpi-node="oel"]');
    check(!!addedOil?.querySelector('.hpi-oil-casing') &&
      !!addedOil?.querySelector('.hpi-oil-control'),
      'Additional oil boiler has a full-size cabinet, burner, and controls');
    const liftCard=await mount({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:[{id:'wood',type:'wood_gasifier',name:'Holzvergaser',
        options:{return_lift:true},
        sensors:{state:ids.burning,flow:ids.flow,return:ids.ret,pump:ids.pump,
          mixer:'sensor.boiler_mixer_position'}}],connections:[]}},hassOf());
    check(!!liftCard.shadowRoot.querySelector('[data-hpi-rla="wood"]') &&
      !!liftCard.shadowRoot.querySelector('[data-hpi-rla="wood"] .hpi-rla-flow'),
      'Checked return-temperature lift attaches to the wood gasifier and animates on pump signal');
    liftCard.hass=hassOf({[ids.pump]:state(ids.pump,'off')});
    check(!!liftCard.shadowRoot.querySelector('[data-hpi-rla="wood"]') &&
      !liftCard.shadowRoot.querySelector('[data-hpi-rla="wood"] .hpi-rla-flow'),
      'Return-temperature lift remains visible but stops animating when loading pump is off');
    liftCard.remove();
    const woodEditor=document.createElement('hydraulic-plan-card-editor');
    woodEditor.setConfig({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:[{id:'wood',type:'wood_gasifier',name:'Holzvergaser',sensors:{}}],connections:[]}});
    document.body.append(woodEditor);
    woodEditor.hass=hassOf();
    const checkBox=woodEditor.querySelector('input[data-return-lift="wood"]');
    let checkedConfig;
    woodEditor.addEventListener('config-changed',ev=>checkedConfig=ev.detail.config);
    if(checkBox){checkBox.checked=true;checkBox.dispatchEvent(new Event('change',{bubbles:true}));}
    check(!!checkBox && checkedConfig?.plan.components[0].options.return_lift===true,
      'Wood gasifier return-temperature lift checkbox persists in YAML configuration');
    check(!!woodEditor.querySelector('input[data-sensor="wood"][data-field="mixer"]'),
      'Mixer position can be assigned when return-temperature lift is enabled');
    woodEditor.remove();

    // Explicit graph mode must not carry inherited legacy hot-water sensors
    // or silently skip links between the original source and original tank.
    const graph=await mount({type:'custom:hydraulic-plan-card',preset:'none',
      generator_type:'oil',entities:{dhw_top:ids.bufTop,buffer_top:ids.bufTop},
      plan:{components:[{id:'wood',type:'wood_gasifier',name:'Holzvergaser',sensors:{}},
        {id:'tank',type:'buffer',name:'Puffer 1',sensors:{}}],
        connections:[{id:'wood_tank',from:'wood',from_port:'flow',to:'tank',to_port:'top_in'}]}},hassOf());
    check(graph._config.generator_type==='wood_gasifier' &&
      !graph._config.entities.dhw_top,'Explicit source overrides legacy fuel and hot-water mapping');
    check(graph.shadowRoot.querySelectorAll('g.hpi-link').length===1,
      'Explicit connection between original source and original buffer is visible');
    check([...graph.shadowRoot.querySelectorAll('path[id^="p-"]')].every(el=>el.style.display==='none'),
      'Unconfigured original fixed pipes are hidden');
    graph.remove();

    // EMS-ESP MQTT Discovery: use manufacturer/device metadata and actual boiler
    // aliases; a generic EMS boiler alone must not be guessed as an oil boiler.
    const emsHass=hassOf({
      'binary_sensor.boiler_burngas':state('binary_sensor.boiler_burngas','on'),
      'sensor.boiler_curflowtemp':state('sensor.boiler_curflowtemp',72,'°C'),
      'sensor.boiler_rettemp':state('sensor.boiler_rettemp',54,'°C'),
      'binary_sensor.boiler_oilpreheat':state('binary_sensor.boiler_oilpreheat','off')
    });
    emsHass.entities=Object.fromEntries([
      'binary_sensor.boiler_burngas','sensor.boiler_curflowtemp',
      'sensor.boiler_rettemp','binary_sensor.boiler_oilpreheat'
    ].map(id=>[id,{device_id:'oil1',platform:'mqtt',unique_id:'ems-esp_'+id}]));
    emsHass.devices={oil1:{name:'Buderus Logano S115U',model:'S115U',
      manufacturer:'EMS-ESP'}};
    const emsEditor=document.createElement('hydraulic-plan-card-editor');
    emsEditor.setConfig({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:[],connections:[]}});
    document.body.append(emsEditor);
    emsEditor.hass=emsHass;
    check(!!emsEditor.querySelector('.hpc-ems')?.textContent.includes('Ölkessel'),
      'EMS-ESP oil boiler is detected from device metadata and oil preheater');
    let emsConfig;
    emsEditor.addEventListener('config-changed',ev=>emsConfig=ev.detail.config);
    emsEditor.querySelector('[data-action="ems-apply"]')?.click();
    const detectedOil=emsConfig?.plan.components.find(c=>c.type==='oil_boiler');
    check(detectedOil?.sensors.flow==='sensor.boiler_curflowtemp' &&
      detectedOil?.sensors.state==='binary_sensor.boiler_burngas',
      'EMS-ESP assigns real boiler values only after user confirms');
    emsEditor.remove();
    const unknownHass=hassOf({
      'binary_sensor.boiler_burngas':state('binary_sensor.boiler_burngas','on'),
      'sensor.boiler_curflowtemp':state('sensor.boiler_curflowtemp',72,'°C'),
      'sensor.boiler_rettemp':state('sensor.boiler_rettemp',54,'°C')
    });
    unknownHass.entities=Object.fromEntries(Object.keys(unknownHass.states).filter(id=>id.includes('boiler_'))
      .map(id=>[id,{device_id:'gas1',platform:'mqtt',unique_id:'ems-esp_'+id}]));
    unknownHass.devices={gas1:{name:'EMS-ESP Boiler',manufacturer:'EMS-ESP'}};
    const genericEditor=document.createElement('hydraulic-plan-card-editor');
    genericEditor.setConfig({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:[],connections:[]}});
    document.body.append(genericEditor);genericEditor.hass=unknownHass;
    check(!!genericEditor.querySelector('.hpc-ems')?.textContent.includes('Brennstoff prüfen') &&
      !genericEditor.querySelector('.hpc-ems')?.textContent.includes('Ölkessel'),
      'EMS bus alone never implies oil as fuel');
    genericEditor.remove();

    const editor=document.createElement('hydraulic-plan-card-editor');
    editor.setConfig({type:'custom:hydraulic-plan-card',plan:{components:sample,connections:edges}});
    document.body.appendChild(editor);editor.hass=hassFree;
    check(!editor.querySelector('#hpc-free-svg') && !editor.querySelector('[data-action="classic"]'), 'Editor extends original view without separate canvas or view switch');
    check(editor.querySelectorAll('[data-pos]').length===0,'Editor never asks for X/Y coordinates');
    const select=editor.querySelector('[data-select="puffer1"]');select?.click();
    check(!!editor.querySelector('input[data-sensor="puffer1"]'),'Editor exposes buffer entity fields');
    const focusInput=editor.querySelector('input[data-name="puffer1"]');
    if(focusInput){
      focusInput.focus();
      focusInput.value='Puffer direkt bearbeiten';
      editor.hass=hassOf({ 'sensor.buffer_25':state('sensor.buffer_25',66,'°C') });
      const inputAfter=editor.querySelector('input[data-name="puffer1"]');
      check(inputAfter===focusInput && document.activeElement===focusInput &&
        inputAfter.value==='Puffer direkt bearbeiten',
        'Frequent HA state updates never destroy focused editor input');
      editor.setConfig({...editor._config});
      check(editor.querySelector('input[data-name="puffer1"]')===focusInput,
        'Equivalent config updates do not reset active editor fields');
      focusInput.value='Puffer 1';
    }
    check(editor.querySelectorAll('[data-level-entity="puffer1"]').length===2,
      'Additional buffer sensors are editable');
    let updatedConfig;
    editor.addEventListener('config-changed',e=>updatedConfig=e.detail.config);
    editor.querySelector('button[data-action="add-level"]')?.click();
    check(updatedConfig?.plan?.components.find(c=>c.id==='puffer1')?.level_sensors.length===3,
      'Adding an intermediate sensor preserves its empty input slot');
    check(editor.querySelectorAll('[data-level-entity="puffer1"]').length===3,
      'New intermediate sensor field renders in the editor');
    const addNode=editor.querySelector('#hpc-free-type');
    if(addNode)addNode.value='diverter';
    editor.querySelector('button[data-action="add-component"]')?.click();
    check(updatedConfig?.plan?.components.length===11,'New components are saved through config-changed');

    // Mixer percentage is a valve position; it must NOT suppress a pump-driven
    // animation at either end of its 0–100% travel.
    const flowNodes=[
      {id:'source',type:'wood_gasifier',name:'Holzvergaser',sensors:{state:ids.burning}},
      {id:'buffer',type:'buffer',name:'Puffer',sensors:{}},
      {id:'pump',type:'pump',name:'Kesselpumpe',sensors:{state:ids.pump}},
      {id:'mix',type:'mixer',name:'Rücklaufanhebung',
        sensors:{position:'sensor.test_mix_position'}},
      {id:'buffer2',type:'buffer',name:'Puffer 2',sensors:{}},
    ];
    const flowEdges=[
      {id:'l1',from:'source',from_port:'flow',to:'pump',to_port:'in'},
      {id:'l2',from:'pump',from_port:'out',to:'mix',to_port:'a'},
      {id:'l3',from:'mix',from_port:'ab',to:'buffer2',to_port:'top_in'},
      {id:'l4',from:'buffer2',from_port:'bottom_out',to:'buffer',to_port:'bottom_in'},
    ];
    const flowCard=await mount({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:flowNodes,connections:flowEdges}},
      hassOf({'sensor.test_mix_position':state('sensor.test_mix_position',0,'%')}));
    const activeFlow=()=>flowCard.shadowRoot.querySelectorAll('g.hpi-link path.flow.on').length;
    check(activeFlow()===4,'Running mapped pump animates connected flow even when mixer is at 0%');
    flowCard.hass=hassOf({'sensor.test_mix_position':state('sensor.test_mix_position',100,'%')});
    check(activeFlow()===4,'Running mapped pump animates connected flow when mixer is at 100%');
    flowCard.hass=hassOf({[ids.pump]:state(ids.pump,'off'),
      'sensor.test_mix_position':state('sensor.test_mix_position',100,'%')});
    check(activeFlow()===0,'Stopped pump disables inferred flow irrespective of mixer position');
    flowCard.setConfig({type:'custom:hydraulic-plan-card',preset:'none',
      plan:{components:flowNodes.map(n=>n.id==='pump'?{...n,sensors:{}}:n),
        connections:flowEdges}});
    flowCard.hass=hassOf({'sensor.test_mix_position':state('sensor.test_mix_position',100,'%')});
    check(activeFlow()===0,'Unknown pump status never fabricates circulation');
    flowCard.remove();
    editor.remove();free.remove();

    const brandNew=await mount({type:'custom:hydraulic-plan-card',preset:'none'},hassOf());
    check(!!brandNew.shadowRoot.getElementById('start-hint'),'Unconfigured classic view has a setup hint');
    check(!brandNew.shadowRoot.textContent.includes('Keine unterstützte Wärmepumpen-Integration'),
      'Generic setup hint does not incorrectly demand a heat-pump integration');
    brandNew.remove();

    wood.remove(); oil.remove(); hybrid.remove();
  } catch (err) {
    failures.push('Unexpected runtime exception: ' + (err?.stack || String(err)));
  }
  document.getElementById('result').textContent = failures.length ? 'FAIL' : 'PASS';
  document.getElementById('log').textContent = messages.join('\n') +
    (failures.length ? '\n\nFAILURES\n' + failures.join('\n') : '');
})();
</script>
</body></html>
