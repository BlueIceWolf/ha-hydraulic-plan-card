<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Hydraulic network regression</title></head><body>
<pre id="result">RUNNING</pre><pre id="log"></pre>
<script>
const HFC_EMITTERS=['radiator','underfloor','column'];
const HFC_UNIT_STYLES=['auto'];
const HFC_UNIT_SIZES=['standard'];
</script>
<script src="../src/flexible-plan.js"></script>
<script src="../src/migration.js"></script>
<script src="../src/hydraulic-network.js"></script>
<script src="../src/integrated-extension.js"></script>
<script>
const checks=[];
function check(condition,label){
  checks.push((condition?'OK ':'FAIL ')+label);
  if(!condition)console.error('Hydraulic network: '+label);
}
const state=(raw,unit='')=>({state:String(raw),attributes:{unit_of_measurement:unit}});
const hass=(values={})=>({states:Object.fromEntries(Object.entries(values)
  .map(([name,value])=>[name,Array.isArray(value)?state(...value):state(value)]))});
const nodes=[
  {id:'buffer3',type:'buffer',name:'Puffer 3',sensors:{}},
  {id:'buffer1',type:'buffer',name:'Puffer 1',sensors:{}},
  {id:'buffer2',type:'buffer',name:'Puffer 2',sensors:{}},
  {id:'pump1',type:'pump',name:'Ladepumpe',sensors:{state:'switch.ladepumpe',volume:'sensor.durchfluss'}},
  {id:'ww',type:'dhw_tank',name:'Warmwasser',sensors:{}}
];
const links=[
  {id:'e1',from:'buffer1',from_port:'top_out',to:'buffer2',to_port:'top_in'},
  {id:'e2',from:'buffer2',from_port:'top_out',to:'buffer3',to_port:'top_in'},
  {id:'e3',from:'buffer1',from_port:'top_out',to:'pump1',to_port:'in'},
  {id:'e4',from:'pump1',from_port:'out',to:'ww',to_port:'coil_in'},
  {id:'e5',from:'ww',from_port:'coil_out',to:'buffer1',to_port:'bottom_in'}
];
const plan=HPC_FREE.normalize({components:nodes,connections:links});
const reversed=HPC_FREE.normalize({components:nodes,connections:[
  {id:'wrong_direction',from:'buffer1',from_port:'top_in',
    to:'buffer2',to_port:'top_out'}
]});
check(reversed.connections.length===0,
  'Normalization drops a pipe whose source is an inlet and destination is an outlet');
check(!HPC_FREE.validConnection({components:nodes,connections:[]},
  'buffer1','top_in','buffer2','top_out'),
  'The editor rejects reversed buffer port directions');
check(HPC_NETWORK.orderedBuffers(plan).map(n=>n.id).join(',')==='buffer1,buffer2,buffer3',
  'Series buffers are sorted by actual hot-water topology, not insertion order');
const graph=HPC_NETWORK.graph(plan);
check(graph.incoming.get('ww').map(e=>e.id).join(',')==='e4'&&
  graph.outgoing.get('ww').map(e=>e.id).join(',')==='e5',
  'Hydraulic graph retains real coil inlet and outlet directions');
const on=HPC_NETWORK.flowStates(plan,hass({'switch.ladepumpe':'on','sensor.durchfluss':[245,'l/h']}));
check(['e3','e4','e5'].every(id=>on.has(id)),
  'Charging pump and measured flow enable both coil legs');
const zero=HPC_NETWORK.flowStates(plan,hass({'switch.ladepumpe':'on','sensor.durchfluss':[0,'l/h']}));
check(!zero.has('e3')&&!zero.has('e4')&&!zero.has('e5'),
  'Measured zero blocks running pump and entire coil return');
const off=HPC_NETWORK.flowStates(plan,hass({'switch.ladepumpe':'off','sensor.durchfluss':[240,'l/h']}));
check(!off.has('e3')&&!off.has('e4')&&!off.has('e5'),
  'Explicitly stopped charging pump blocks both pipes even with stale positive flow');
const unknown=HPC_NETWORK.flowStates(plan,hass());
check(!unknown.size,'No sensor means unknown, never fabricated circulation');
const measuredZero=structuredClone(plan);
measuredZero.connections.find(e=>e.id==='e4').flow_entity='sensor.coil_flow';
const stopped=HPC_NETWORK.flowStates(measuredZero,hass({
  'switch.ladepumpe':'on','sensor.durchfluss':[240,'l/h'],'sensor.coil_flow':[0,'l/h']}));
check(!stopped.has('e4')&&!stopped.has('e5'),
  'Coil flow meter zero blocks return independently of pump command');
const independentLoop=HPC_FREE.normalize({
  components:[...nodes,{id:'hk',type:'heating_circuit',name:'Heizkreis',sensors:{}}],
  connections:[...links,
    {id:'heatSupply',from:'buffer1',from_port:'top_out',to:'hk',to_port:'flow_in'},
    {id:'heatReturn',from:'hk',from_port:'return_out',to:'buffer1',to_port:'bottom_in'}]
});
const wwOnly=HPC_NETWORK.flowStates(independentLoop,
  hass({'switch.ladepumpe':'on','sensor.durchfluss':[240,'l/h']}));
check(wwOnly.has('e4')&&wwOnly.has('e5')&&
  !wwOnly.has('heatSupply')&&!wwOnly.has('heatReturn'),
  'Dedicated WW loading pump never animates unknown parallel heating circuit');
const independentlyPumped=structuredClone(independentLoop);
independentlyPumped.components.find(c=>c.id==='hk').sensors.pump='switch.hk_pumpe';
const heatingOnly=HPC_NETWORK.flowStates(independentlyPumped,
  hass({'switch.ladepumpe':'off','switch.hk_pumpe':'on'}));
check(!heatingOnly.has('e4')&&!heatingOnly.has('e5')&&
  heatingOnly.has('heatSupply')&&heatingOnly.has('heatReturn'),
  'Heating circuit still circulates when a separate WW loading pump is off');
const unknownWwPump=HPC_NETWORK.flowStates(independentlyPumped,
  hass({'switch.ladepumpe':'unavailable','switch.hk_pumpe':'on'}));
check(unknownWwPump.has('heatSupply')&&unknownWwPump.has('heatReturn')&&
  !unknownWwPump.has('e3')&&!unknownWwPump.has('e4')&&!unknownWwPump.has('e5'),
  'Heating pump never activates an independent WW coil whose own pump is unavailable');
const heatingOff=HPC_NETWORK.flowStates(independentlyPumped,
  hass({'switch.ladepumpe':'on','sensor.durchfluss':[240,'l/h'],
    'switch.hk_pumpe':'off'}));
check(['e3','e4','e5'].every(id=>heatingOff.has(id))&&
  !heatingOff.has('heatSupply')&&!heatingOff.has('heatReturn'),
  'Stopped heating return cannot suppress independent active WW charging loop');
// An ON command is not hydraulic proof when there is no return connection.
const openLoop=structuredClone(independentlyPumped);
openLoop.connections=openLoop.connections.filter(e=>e.id!=='heatReturn');
const openPump=HPC_NETWORK.flowStates(openLoop,
  hass({'switch.ladepumpe':'off','switch.hk_pumpe':'on'}));
check(!openPump.has('heatSupply')&&openPump.size===0,
  'An open heating supply never animates as a closed circuit');

// The same circuit with a proper return is inferred from its pump, not metered.
const completePump=HPC_NETWORK.flowEvidence(independentlyPumped,
  hass({'switch.ladepumpe':'off','switch.hk_pumpe':'on'}));
check(completePump.get('heatSupply')?.state==='inferred'&&
  completePump.get('heatReturn')?.state==='inferred',
  'A complete running heating loop is classified as inferred, not measured');
const measuredPlan=structuredClone(independentlyPumped);
measuredPlan.connections.find(e=>e.id==='heatSupply').flow_entity='sensor.hk_measured';
const measuredEvidence=HPC_NETWORK.flowEvidence(measuredPlan,
  hass({'switch.ladepumpe':'off','switch.hk_pumpe':'on',
    'sensor.hk_measured':[125,'l/h']}));
check(measuredEvidence.get('heatSupply')?.state==='measured',
  'Positive volumetric sensor readings are classified as measured flow');
const unknownEvidence=HPC_NETWORK.flowEvidence(openLoop,hass());
check(unknownEvidence.get('heatSupply')?.state==='unknown',
  'Open or unobserved hydraulic branches remain explicitly unknown');

// A stopped inline pump must interrupt an otherwise reachable path.
const blockedLoop=structuredClone(independentlyPumped);
blockedLoop.connections.find(e=>e.id==='heatReturn').flow_entity='sensor.hk_volumen';
check(!HPC_NETWORK.flowStates(blockedLoop,
  hass({'switch.ladepumpe':'off','switch.hk_pumpe':'on',
    'sensor.hk_volumen':[0,'l/h']})).has('heatSupply'),
  'Measured zero on the return disables the complete closed heating loop');
const mixerPlan=HPC_FREE.normalize({
  components:[
    {id:'mixer_source',type:'heat_pump',sensors:{pump:'switch.hp'}},
    {id:'mixer_valve',type:'mixer',sensors:{position:'sensor.mix'}},
    {id:'mixer_hc',type:'heating_circuit',sensors:{pump:'switch.hc'}}
  ],
  connections:[
    {id:'mixer_hot',from:'mixer_source',from_port:'flow',to:'mixer_valve',to_port:'a'},
    {id:'mixer_supply',from:'mixer_valve',from_port:'ab',to:'mixer_hc',to_port:'flow_in'},
    {id:'mixer_return',from:'mixer_hc',from_port:'return_out',to:'mixer_source',to_port:'return'}
  ]
});
const mixerOn=hass({'switch.hp':'on','switch.hc':'on','sensor.mix':[0,'%']});
check(HPC_NETWORK.flowEvidence(mixerPlan,mixerOn).get('mixer_supply')?.state==='inferred',
  'A 0% mixer position alone does not interrupt an otherwise complete circuit');
const knownClosed=structuredClone(mixerPlan);
knownClosed.components.find(n=>n.id==='mixer_valve').options={a_closed_at:0};
const closedEvidence=HPC_NETWORK.flowEvidence(knownClosed,mixerOn);
check(!HPC_NETWORK.flowStates(knownClosed,mixerOn).has('mixer_hot')&&
  closedEvidence.get('mixer_hot')?.state==='stopped'&&
  closedEvidence.get('mixer_hot')?.basis==='mixer',
  'An explicitly mapped closed mixer path interrupts only that path');
const unknownMixer=structuredClone(mixerPlan);
unknownMixer.components.find(n=>n.id==='mixer_valve').sensors.position='sensor.unknown_mix';
check(HPC_NETWORK.flowEvidence(unknownMixer,hass({
  'switch.hp':'on','switch.hc':'on'})).get('mixer_supply')?.state==='inferred',
  'An unknown mixer position does not fabricate a closed path');
const metadata={components:[{id:'boiler',type:'oil_boiler',name:'Old boiler',
  sensors:{custom_future:'sensor.custom_extra'},options:{future_setting:'keep'},
  custom_details:{a:1}}],
  connections:[]};
const roundTrip=HPC_FREE.normalize(metadata);
check(roundTrip.components[0].custom_details.a===1 &&
  roundTrip.components[0].options.future_setting==='keep'&&
  roundTrip.components[0].sensors.custom_future==='sensor.custom_extra',
  'Unknown extension fields remain intact during editor normalization');
const geom=HPC_NETWORK.route({edge:{from_port:'coil_out',to_port:'bottom_in'},
  fromNode:{type:'dhw_tank'},toNode:{type:'buffer'},
  fromShape:{x:1080,y:40,w:120,h:200},toShape:{x:520,y:320,w:120,h:200},
  p:{x:1080,y:215},q:{x:520,y:495},fromSide:'L',toSide:'L'});
check(geom.startsWith('M1080 215 H1010')&&geom.endsWith('H520'),
  'Return route takes the outside tank connection, not the vessel interior');
// Three-way changeover: only the explicitly selected outlet can circulate.
const valveNodes=[
  {id:'heat',type:'oil_boiler',name:'Oil boiler',sensors:{pump:'switch.main_pump'}},
  {id:'threeway',type:'diverter',name:'WW Umschaltung',sensors:{position:'sensor.valve'},
    options:{dhw_port:'a',dhw_state:'WW',heating_state:'Heizen'}},
  {id:'water',type:'dhw_tank',name:'WW',sensors:{}},
  {id:'circuit',type:'heating_circuit',name:'HK',sensors:{}}
];
const valveConnections=[
  {id:'sourcefeed',from:'heat',from_port:'flow',to:'threeway',to_port:'ab'},
  {id:'wwfeed',from:'threeway',from_port:'a',to:'water',to_port:'coil_in'},
  {id:'wwback',from:'water',from_port:'coil_out',to:'heat',to_port:'return'},
  {id:'heatfeed',from:'threeway',from_port:'b',to:'circuit',to_port:'flow_in'},
  {id:'heatback',from:'circuit',from_port:'return_out',to:'heat',to_port:'return'}
];
const valvePlan=HPC_FREE.normalize({components:valveNodes,connections:valveConnections});
const wwFlow=HPC_NETWORK.flowStates(valvePlan,
  hass({'sensor.valve':'WW','switch.main_pump':'on'}));
check(wwFlow.has('wwfeed')&&wwFlow.has('wwback')&&!wwFlow.has('heatfeed'),
  'WW valve state opens coil inlet and return but not heating outlet');
const heatFlow=HPC_NETWORK.flowStates(valvePlan,
  hass({'sensor.valve':'Heizen','switch.main_pump':'on'}));
check(!heatFlow.has('wwfeed')&&!heatFlow.has('wwback')&&heatFlow.has('heatfeed'),
  'Heating valve state closes WW supply and return, opens heating circuit');
const unknownValve=HPC_NETWORK.flowStates(valvePlan,
  hass({'sensor.valve':'unknown','switch.main_pump':'on'}));
check(!unknownValve.has('wwfeed')&&!unknownValve.has('heatfeed'),
  'Unrecognized valve state never chooses a path');
const numericValve=structuredClone(valvePlan);
numericValve.components.find(node=>node.type==='diverter').options={
  dhw_port:'a',dhw_state:'0',heating_state:'100'};
const numericWw=HPC_NETWORK.flowStates(numericValve,
  hass({'sensor.valve':0,'switch.main_pump':'on'}));
check(numericWw.has('wwfeed')&&!numericWw.has('heatfeed'),
  'Numeric changeover 0 maps to WW only with an explicit valve setting');
const numericHeat=HPC_NETWORK.flowStates(numericValve,
  hass({'sensor.valve':100,'switch.main_pump':'on'}));
check(numericHeat.has('heatfeed')&&!numericHeat.has('wwfeed')&&!numericHeat.has('wwback'),
  'Numeric changeover 100 maps to heating and blocks the coil return');
const unassigned=structuredClone(numericValve);
unassigned.components.find(node=>node.type==='diverter').options={
  dhw_port:'a',dhw_state:'',heating_state:''};
const noGuess=HPC_NETWORK.flowStates(unassigned,
  hass({'sensor.valve':0,'switch.main_pump':'on'}));
check(!noGuess.has('wwfeed')&&!noGuess.has('heatfeed'),
  'Numeric position without installer mapping does not invent flow');
const splitRoutes=HPC_NETWORK.mergeRoutes([
  {edge:{id:'flow1',from_port:'top_out',to_port:'flow_in'},
    d:'M640 360 H680 V340 H815',on:false},
  {edge:{id:'flow2',from_port:'top_out',to_port:'flow_in'},
    d:'M640 360 H680 V590 H815',on:true}
]);
check(!splitRoutes.get('flow1').pipe.includes('M640 360 H680')&&
  splitRoutes.get('flow2').flow.includes('M640 360 H680'),
  'Shared header is drawn once on the actually flowing route, never the stopped branch');
// Classify hydraulic evidence without inventing a numerical flow rate.
const evidMeasured=HPC_NETWORK.flowEvidence(plan,
  hass({'switch.ladepumpe':'on','sensor.durchfluss':[245,'l/h']}));
check(evidMeasured.get('e3')?.state==='measured'&&
  evidMeasured.get('e4')?.state==='measured',
  'Positive volumetric measurement is reported as measured evidence');
check(evidMeasured.get('e5')?.state==='inferred',
  'A shared return is not falsely labelled as directly measured');
const evidOff=HPC_NETWORK.flowEvidence(plan,
  hass({'switch.ladepumpe':'off','sensor.durchfluss':[240,'l/h']}));
check(evidOff.get('e4')?.state==='stopped'&&
  evidOff.get('e5')?.state==='stopped',
  'Stopped charging pump marks both coil legs definitively interrupted');
const evidUnknown=HPC_NETWORK.flowEvidence(plan,hass());
check(evidUnknown.get('e4')?.state==='unknown'&&
  evidUnknown.get('e5')?.state==='unknown',
  'Missing measurements and pump state remain unknown');
const evidValved=HPC_NETWORK.flowEvidence(valvePlan,
  hass({'sensor.valve':'Heizen','switch.main_pump':'on'}));
check(evidValved.get('wwfeed')?.state==='stopped'&&
  evidValved.get('wwback')?.state==='stopped',
  'Heating changeover stops the entire WW coil including its return');
const crossing=HPC_NETWORK.mergeRoutes([
  {edge:{id:'hot',from_port:'flow',to_port:'flow_in'},d:'M0 25 H100',on:true},
  {edge:{id:'cold',from_port:'return_out',to_port:'bottom_in'},
    d:'M50 0 V50',on:true}
]);
check(crossing.get('hot')?.pipe.includes('H44')&&
  crossing.get('hot')?.pipe.includes('M56 25 H100')&&
  crossing.get('cold')?.pipe==='M50 0 V50',
  'Crossing hot flow has a drafting gap; unrelated return is continuous');
const actualTee=HPC_NETWORK.mergeRoutes([
  {edge:{id:'t1',from_port:'top_out',to_port:'flow_in'},
    d:'M0 25 H100',on:true},
  {edge:{id:'t2',from_port:'top_out',to_port:'flow_in'},
    d:'M50 25 V60',on:true}
]);
check(!actualTee.get('t1')?.pipe.includes('H44')&&
  actualTee.get('t1')?.pipe.includes('H100'),
  'Shared supply T-junction does not acquire a false crossing gap');
// Explicit parallel coupling must never be guessed from serial tank order.
const parallelBase=HPC_FREE.normalize({
  components:[{id:'oil_source',type:'oil_boiler',name:'Ölkessel',sensors:{}},
    {id:'b1',type:'buffer',name:'Puffer 1',sensors:{}},
    {id:'b2',type:'buffer',name:'Puffer 2',sensors:{}},
    {id:'b3',type:'buffer',name:'Puffer 3',sensors:{}}],
  connections:[]
});
const parallel=HPC_FREE.connectBuffersParallel(parallelBase,'oil_source');
check(parallel?.connections.length===6&&
  HPC_NETWORK.bufferTopology(parallel).mode==='parallel'&&
  HPC_NETWORK.bufferTopology(parallel).sourceId==='oil_source',
  'Parallel tank headers require explicit selected generator and real hot/return legs');
const parallelAgain=HPC_FREE.connectBuffersParallel(parallel,'oil_source');
check(parallelAgain?.connections.length===6,
  'Parallel linking is idempotent and never duplicates common headers');
const confirmedSerial=HPC_FREE.connectBufferSeries(parallelBase);
check(HPC_FREE.connectBuffersParallel(confirmedSerial,'oil_source')===null&&
  confirmedSerial.connections.length===4,
  'User-defined serial topology cannot be silently replaced by a parallel guess');
const heatingBase=HPC_FREE.normalize({components:[
  {id:'automatic_buffer',type:'buffer',name:'Puffername bleibt',sensors:{top:'sensor.top'}},
  {id:'automatic_hc',type:'heating_circuit',name:'Heizkreis EG',sensors:{pump:'switch.eg'},
    options:{mixed:true,emitter:'underfloor'}}
],connections:[]});
check(HPC_FREE.preferredHeatingBuffer(heatingBase)==='automatic_buffer',
  'A single buffer is an unambiguous default heat source');
const autoHeating=HPC_FREE.connectHeatingCircuit(heatingBase,
  'automatic_hc','automatic_buffer');
check(autoHeating?.connections.length===2&&
  autoHeating.connections.some(edge=>edge.from==='automatic_buffer'&&
    edge.from_port==='top_out'&&edge.to==='automatic_hc'&&edge.to_port==='flow_in')&&
  autoHeating.connections.some(edge=>edge.from==='automatic_hc'&&
    edge.from_port==='return_out'&&edge.to==='automatic_buffer'&&edge.to_port==='bottom_in'),
  'Automatic heating connection creates the prescribed supply and return ports');
check(autoHeating.components.find(node=>node.id==='automatic_hc').name==='Heizkreis EG'&&
  autoHeating.components.find(node=>node.id==='automatic_hc').sensors.pump==='switch.eg'&&
  autoHeating.components.find(node=>node.id==='automatic_buffer').sensors.top==='sensor.top',
  'Automatic linking preserves component names and sensor assignments');
check(HPC_FREE.connectHeatingCircuit(autoHeating,'automatic_hc',
  'automatic_buffer')?.connections.length===2,
  'Saving an already-connected heating circuit does not duplicate its pair');
const ambiguousHeating=HPC_FREE.normalize({components:[
  {id:'ambiguous_b1',type:'buffer',sensors:{}},
  {id:'ambiguous_b2',type:'buffer',sensors:{}},
  {id:'ambiguous_hc',type:'heating_circuit',sensors:{}}
],connections:[]});
check(HPC_FREE.preferredHeatingBuffer(ambiguousHeating)===null,
  'Multiple unconnected buffers require an explicit source choice');
const confirmedSource=HPC_FREE.normalize({components:[
  {id:'established_source',type:'heat_pump',sensors:{}},
  {id:'established_b1',type:'buffer',sensors:{}},
  {id:'established_b2',type:'buffer',sensors:{}},
  {id:'established_hc',type:'heating_circuit',sensors:{}}
],connections:[{id:'established_feed',from:'established_source',from_port:'flow',
  to:'established_b2',to_port:'top_in'}]});
check(HPC_FREE.preferredHeatingBuffer(confirmedSource)==='established_b2',
  'A unique buffer already fed by a heat source is preferred in a multi-buffer plan');
const withAlternateSource=HPC_FREE.normalize({...autoHeating,components:[
  ...autoHeating.components,{id:'alternate_source',type:'heat_pump',
    name:'Alternate source',sensors:{}}
]});
const automaticReplacement=HPC_FREE.connectHeatingCircuit(withAlternateSource,
  'automatic_hc','alternate_source','direct','',{replace:true});
check(automaticReplacement?.connections.length===2&&
  automaticReplacement.connections.every(edge=>
    edge.from!=='automatic_buffer'&&edge.to!=='automatic_buffer')&&
  automaticReplacement.connections.some(edge=>edge.from==='alternate_source'&&
    edge.to==='automatic_hc')&&
  automaticReplacement.components.find(node=>node.id==='automatic_hc')
    .sensors.pump==='switch.eg',
  'Replacing an auto-created pair moves supply and return together without losing sensors');
const incompleteHeating=HPC_FREE.normalize({components:[
  {id:'partial_buffer',type:'buffer',sensors:{}},
  {id:'partial_hc',type:'heating_circuit',sensors:{}}
],connections:[{id:'manual_supply',from:'partial_buffer',from_port:'mid_out',
  to:'partial_hc',to_port:'flow_in'}]});
const completedHeating=HPC_FREE.connectHeatingCircuit(incompleteHeating,
  'partial_hc','partial_buffer');
check(completedHeating?.connections.length===2&&
  completedHeating.connections.some(edge=>edge.id==='manual_supply')&&
  completedHeating.connections.some(edge=>edge.from==='partial_hc'&&
    edge.to==='partial_buffer'&&edge.to_port==='bottom_in'),
  'Confirming an incomplete matching direct pair adds only its missing return');
const manualHeating=HPC_FREE.normalize({components:[
  {id:'manual_a',type:'buffer',sensors:{}},
  {id:'manual_b',type:'buffer',sensors:{}},
  {id:'manual_hc',type:'heating_circuit',sensors:{}}
],connections:[{id:'custom_supply',from:'manual_a',from_port:'mid_out',
  to:'manual_hc',to_port:'flow_in'}]});
check(HPC_FREE.connectHeatingCircuit(manualHeating,'manual_hc','manual_b')===null&&
  manualHeating.connections.length===1,
  'An incomplete manual supply from another source is never silently replaced');
const controlHeatingBase=HPC_FREE.normalize({components:[
  {id:'control_buffer',type:'buffer',sensors:{}},
  {id:'control_pump',type:'pump',sensors:{state:'switch.group_pump'}},
  {id:'control_mixer',type:'mixer',sensors:{position:'sensor.group_mixer'}},
  {id:'control_hc',type:'heating_circuit',sensors:{pump:'switch.control_hc'}}
],connections:[]});
const pumpedHeating=HPC_FREE.connectHeatingCircuit(controlHeatingBase,
  'control_hc','control_buffer','pump','control_pump');
check(pumpedHeating?.connections.length===3&&
  pumpedHeating.connections.some(edge=>edge.from==='control_buffer'&&
    edge.to==='control_pump'&&edge.to_port==='in')&&
  pumpedHeating.connections.some(edge=>edge.from==='control_pump'&&
    edge.to==='control_hc'&&edge.to_port==='flow_in')&&
  pumpedHeating.connections.some(edge=>edge.from==='control_hc'&&
    edge.to==='control_buffer'&&edge.to_port==='bottom_in'),
  'An existing pump group is inserted in the supply while the return remains paired');
const mixedHeating=HPC_FREE.connectHeatingCircuit(controlHeatingBase,
  'control_hc','control_buffer','mixer','control_mixer');
check(mixedHeating?.connections.length===4&&
  mixedHeating.connections.some(edge=>edge.from==='control_buffer'&&
    edge.to==='control_mixer'&&edge.to_port==='a')&&
  mixedHeating.connections.some(edge=>edge.from==='control_mixer'&&
    edge.from_port==='ab'&&edge.to==='control_hc')&&
  mixedHeating.connections.some(edge=>edge.from==='control_hc'&&
    edge.to==='control_mixer'&&edge.to_port==='b')&&
  mixedHeating.connections.some(edge=>edge.from==='control_mixer'&&
    edge.from_port==='b'&&edge.to==='control_buffer'),
  'An existing three-way mixer uses A, AB and B for supply and return');
// The wood-gasifier return lift takes its hot leg from the existing
// supply header and rejoins the existing return header. A bypass must not
// paint a second pipe over either header.
const bypassRoutes=HPC_NETWORK.mergeRoutes([
  {edge:{id:'hot',from_port:'flow',to_port:'top_in'},
    d:'M290 250 H400 V320 H520',on:true},
  {edge:{id:'return',from_port:'bottom_out',to_port:'return'},
    d:'M520 380 H290',on:true},
  {edge:{id:'lift',kind:'return_lift',from_port:'flow',to_port:'return'},
    d:'M290 250 H332 V380 H290',on:true}
]);
check(bypassRoutes.get('lift').pipe.includes('V380') &&
  !bypassRoutes.get('lift').pipe.includes('M290 250 H332') &&
  !bypassRoutes.get('lift').pipe.includes('M332 380 H290') &&
  bypassRoutes.get('hot').pipe.includes('M290 250 H332'),
  'Return lift draws only the missing bypass leg, sharing hot supply and cold return');

// The chimney is decoration, never an endpoint for water.
const s3=HPC_FREE.normalize({components:[
  {id:'s3',type:'wood_gasifier',name:'Fröling S3',sensors:{
    pump:'switch.s3',flow:'sensor.s3_vl',return:'sensor.s3_rl'
  },options:{froeling_view:'s3_turbo',return_lift:true,mixer_inverted:false}},
  {id:'s3_buffer',type:'buffer',name:'Puffer',sensors:{}},
  {id:'s3_hk',type:'heating_circuit',name:'Heizkreis',sensors:{},
    options:{mixed:true,mixer_inverted:true}}
],connections:[
  {id:'s3_vl',from:'s3',from_port:'flow',to:'s3_buffer',to_port:'top_in'},
  {id:'s3_rl',from:'s3_buffer',from_port:'bottom_out',to:'s3',to_port:'return'},
  {id:'s3_hk_vl',from:'s3_buffer',from_port:'top_out',to:'s3_hk',to_port:'flow_in'},
  {id:'s3_hk_rl',from:'s3_hk',from_port:'return_out',to:'s3_buffer',to_port:'bottom_in'}
]});
check(HPC_MIGRATION.check(s3).length===0,
  'Known S3 cutaway and mixer inversion settings survive migration without warnings');
const s3Model=HPC_INTEGRATED.layout(s3);
const s3Node=s3.components.find(node=>node.id==='s3');
const s3Box=s3Model.anchored.get('s3');
const s3Flow=HPC_INTEGRATED.port(s3Node,s3Box,'flow');
const s3Return=HPC_INTEGRATED.port(s3Node,s3Box,'return');
const s3SocketX=52+238*350/540;
check(Math.abs(s3Flow.x-s3SocketX)<.01&&Math.abs(s3Return.x-s3SocketX)<.01&&
  Math.abs(s3Flow.y-(235+156*162/355))<.01&&
  Math.abs(s3Return.y-(235+156*300/355))<.01,
  'Both real hydraulic ports meet the boiler water jacket, not the exhaust');
const s3Render=HPC_INTEGRATED.svg(s3Model,hass({
  'switch.s3':'on','sensor.s3_vl':[72,'°C'],'sensor.s3_rl':[48,'°C']
}));
const s3Svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
s3Svg.innerHTML=s3Render.body;
const s3ReturnPipe=s3Svg.querySelector('[data-hpi-edge="s3_rl"] .pipe')?.getAttribute('d')||'';
const s3Art=s3Svg.querySelector('.hpi-froeling-primary .hpi-froeling');
const s3Sockets=s3Art?.querySelectorAll('.hpi-fr-water-ports path');
check(s3Sockets?.length===2&&[...s3Sockets].every(path=>
  /H350$/.test(path.getAttribute('d')||'')),
  'Only two short local pipe sockets, no independent external VL/RL stubs');
check(s3Art?.querySelector('.hpi-fr-flue')?.getAttribute('d')==='M445 85 H470 V12',
  'The flue points upward and is geometrically separate from water connections');

const rlaPath=s3Svg.querySelector('[data-hpi-edge="rla_s3"] .pipe')?.getAttribute('d')||'';
const rlaMarker=s3Svg.querySelector('[data-hpi-rla-marker="s3"]');
const rlaPump=rlaMarker?.querySelector('.hpi-rla-pump');
const rlaValve=rlaMarker?.querySelector('.hpi-rla-valve');
const s3ReturnY=s3Return.y;
const mixerAtX=s3Return.x+95;
check(rlaPath.includes('M'+mixerAtX+' '+s3Flow.y)&&
  rlaPath.includes('V'+s3ReturnY),
  'S3 hot bypass runs to right-side RLA, not behind boiler or through chimney');
check(rlaPump?.getAttribute('cx')===String(s3Return.x+43)&&
  rlaPump?.getAttribute('cy')===String(s3ReturnY)&&
  rlaValve?.getAttribute('cx')===String(mixerAtX)&&
  rlaValve?.getAttribute('cy')===String(s3ReturnY),
  'S3 return loading pump sits between physical return socket and RLA mixer');
const s3RlaReturn=s3ReturnPipe.replace(/M/g,' M');
check(!s3RlaReturn.includes('H69')&&
  s3RlaReturn.includes('H'+mixerAtX)&&
  s3RlaReturn.endsWith('H'+s3Return.x),
  'S3 return pipe approaches from right and joins RLA without left boiler loop');

check(s3ReturnPipe.endsWith('H'+s3Return.x)&&
  !/V288(?:\\s|$)/.test(s3ReturnPipe),
  'The return approaches the water port directly without a chimney detour');

// The puffer feed stays hot until the mixer; the mixed flow and return
// get their own temperature colours. Neither the SVG nor the source
// invents measured l/min values.
const colourPlan=structuredClone(s3);
colourPlan.components.find(node=>node.id==='s3_buffer').sensors={
  top:'sensor.s3_buffer_top',bottom:'sensor.s3_buffer_bottom'};
colourPlan.components.find(node=>node.id==='s3_hk').sensors={
  pump:'switch.s3_hk',mixer:'sensor.s3_mixer',return:'sensor.s3_hk_return'};
const colourHass=hass({
  'switch.s3':'on','switch.s3_hk':'on',
  'sensor.s3_buffer_top':[68,'°C'],'sensor.s3_buffer_bottom':[30,'°C'],
  'sensor.s3_mixer':[50,'%'],'sensor.s3_hk_return':[32,'°C']
});
const coloured=HPC_INTEGRATED.svg(HPC_INTEGRATED.layout(colourPlan),colourHass);
const colourSegments=coloured.nativePipes.s3_hk?.flow?.colored||[];
const hotColor=HPC_FREE.color(HPC_FREE.state(colourHass,'sensor.s3_buffer_top'));
const mixedColor=HPC_FREE.color({number:50,unit:'°C'});
const returnColor=HPC_FREE.color(HPC_FREE.state(colourHass,'sensor.s3_hk_return'));
check(colourSegments.length>=3&&colourSegments[0].color===hotColor&&
  colourSegments[1].color===hotColor&&
  colourSegments.at(-1).color===mixedColor,
  '68 °C hot-buffer water reaches the mixer; 50 °C mixture is coloured separately');
check(coloured.nativePipes.s3_hk?.return?.colored?.[0]?.color===returnColor&&
  coloured.nativePipes.s3_hk?.mixer?.colored?.[0]?.color===returnColor,
  'Measured return temperature controls both return elbow and mixer bypass');
// 32 °C return water must read as blue, not purple; 43 °C stays
// blue-leaning, while 75 °C is a hot pink/red and >=90 °C full red.
const coldColor=HPC_FREE.color({number:32,unit:'°C'});
const nearCold=HPC_FREE.color({number:43,unit:'°C'});
const hotBand=HPC_FREE.color({number:75,unit:'°C'});
const rgb=text=>(text.match(/\d+/g)||[]).map(Number);
const coldRgb=rgb(coldColor),nearRgb=rgb(nearCold),hotRgb=rgb(hotBand);
check(coldRgb[2]>coldRgb[0]*2.5&&coldRgb[2]>coldRgb[1],
  'Cold/32 °C remains visibly blue and not purple');
check(nearRgb[2]>nearRgb[0]*1.8,
  '43 °C return still has a blue-dominant hue');
check(hotRgb[0]>hotRgb[2]*1.8,
  '75 °C hot buffer water is red/pink, not a cold hue');
const expectedTarget=HPC_FREE.color({number:40,unit:'°C'});
const targetPlan=structuredClone(colourPlan);
targetPlan.components.find(node=>node.id==='s3_hk').sensors.target='sensor.s3_hk_target';
const targetHass=hass({
  'switch.s3':'on','switch.s3_hk':'on',
  'sensor.s3_buffer_top':[75,'°C'],'sensor.s3_buffer_bottom':[35,'°C'],
  'sensor.s3_hk_target':[40,'°C'],'sensor.s3_hk_return':[32,'°C']
});
const targetResult=HPC_INTEGRATED.svg(HPC_INTEGRATED.layout(targetPlan),targetHass)
  .nativePipes.s3_hk.flow.colored;
check(targetResult[0].color===HPC_FREE.color({number:75,unit:'°C'})&&
  targetResult[1].color===HPC_FREE.color({number:75,unit:'°C'})&&
  targetResult.at(-1).color===expectedTarget,
  'Hot puffer VL reaches mixer; afterwards use configured target without actual');
const actualPlan=structuredClone(targetPlan);
actualPlan.components.find(node=>node.id==='s3_hk').sensors.flow='sensor.s3_hk_actual';
const actualHass=hass({
  'switch.s3':'on','switch.s3_hk':'on',
  'sensor.s3_buffer_top':[75,'°C'],
  'sensor.s3_hk_target':[40,'°C'],'sensor.s3_hk_actual':[44,'°C'],
  'sensor.s3_hk_return':[32,'°C']
});
const actualResult=HPC_INTEGRATED.svg(HPC_INTEGRATED.layout(actualPlan),actualHass)
  .nativePipes.s3_hk.flow.colored;
check(actualResult.at(-1).color===HPC_FREE.color({number:44,unit:'°C'}),
  'Actual measured heating flow takes precedence over the setpoint after mixer');

// The classic WW / heating buffer switching topology must be created by
// one editor action: AB feed, A->DHW, B->buffer, shared return to the source.
const switchedBase=HPC_FREE.normalize({
  components:[
    {id:'sw_wp',type:'heat_pump',sensors:{pump:'switch.sw_wp'}},
    {id:'sw_ww',type:'dhw_tank'},
    {id:'sw_buffer',type:'buffer'}
  ],
  connections:[
    {id:'sw_direct_flow',from:'sw_wp',from_port:'flow',to:'sw_buffer',to_port:'top_in'},
    {id:'sw_direct_return',from:'sw_buffer',from_port:'bottom_out',to:'sw_wp',to_port:'return'}
  ]
});
const switched=HPC_FREE.connectDhwBufferDiverter(
  switchedBase,'sw_wp','sw_ww','sw_buffer');
const swValve=switched?.components.find(node=>node.type==='diverter');
const swEdge=(from,fromPort,to,toPort)=>switched?.connections.find(edge=>
  edge.from===from&&edge.from_port===fromPort&&
  edge.to===to&&edge.to_port===toPort);
check(!!switched&&!!swValve&&switched.connections.length===5&&
  !switched.connections.some(edge=>edge.id==='sw_direct_flow')&&
  !!swEdge('sw_wp','flow',swValve.id,'ab')&&
  !!swEdge(swValve.id,'a','sw_ww','coil_in')&&
  !!swEdge(swValve.id,'b','sw_buffer','top_in')&&
  !!swEdge('sw_ww','coil_out','sw_wp','return')&&
  !!swEdge('sw_buffer','bottom_out','sw_wp','return'),
  'Diverter helper replaces direct buffer feed with complete DHW/heat changeover');
if(switched&&swValve){
  swValve.sensors.position='sensor.sw_valve';
  swValve.options={...swValve.options,dhw_state:'WW',heating_state:'Heizen'};
  const swDhw=HPC_NETWORK.flowStates(switched,hass({
    'switch.sw_wp':'on','sensor.sw_valve':'WW'
  }));
  const swHeat=HPC_NETWORK.flowStates(switched,hass({
    'switch.sw_wp':'on','sensor.sw_valve':'Heizen'
  }));
  const swUnknown=HPC_NETWORK.flowStates(switched,hass({
    'switch.sw_wp':'on','sensor.sw_valve':'unavailable'
  }));
  const ww=swEdge(swValve.id,'a','sw_ww','coil_in').id;
  const heating=swEdge(swValve.id,'b','sw_buffer','top_in').id;
  const wwReturn=swEdge('sw_ww','coil_out','sw_wp','return').id;
  const heatingReturn=swEdge('sw_buffer','bottom_out','sw_wp','return').id;
  check(swDhw.has(ww)&&swDhw.has(wwReturn)&&
    !swDhw.has(heating)&&!swDhw.has(heatingReturn),
    'Warmwater valve state circulates only through coil and its return');
  check(swHeat.has(heating)&&swHeat.has(heatingReturn)&&
    !swHeat.has(ww)&&!swHeat.has(wwReturn),
    'Heating valve state circulates only through buffer and its return');
  check(!swUnknown.has(ww)&&!swUnknown.has(heating)&&
    !swUnknown.has(wwReturn)&&!swUnknown.has(heatingReturn),
    'Unknown valve position cannot animate either switched branch');
}

// Regression: secondary Fröling, oil boiler, shared return rails, framed
// generators and measured return-temperature lift must coexist.
const combinedPlan=HPC_FREE.normalize({components:[
  {id:'combined_oil',type:'oil_boiler',name:'Buderus',sensors:{flow:'sensor.combined_oil_vl'}},
  {id:'combined_s3',type:'wood_gasifier',name:'Fröling S3',sensors:{
    flow:'sensor.combined_s3_vl',return:'sensor.combined_s3_rl',
    pump:'switch.combined_s3'},options:{froeling_view:'s3_turbo',return_lift:true}},
  {id:'combined_buffer',type:'buffer',name:'Puffer',sensors:{
    top:'sensor.combined_buffer_top',bottom:'sensor.combined_buffer_bottom'}},
  {id:'combined_hk',type:'heating_circuit',name:'EG',sensors:{
    flow:'sensor.combined_hk_flow',return:'sensor.combined_hk_return',
    pump:'switch.combined_hk'},options:{mixed:true}}
],connections:[
  {id:'c_oil_vl',from:'combined_oil',from_port:'flow',to:'combined_buffer',to_port:'top_in'},
  {id:'c_oil_rl',from:'combined_buffer',from_port:'bottom_out',to:'combined_oil',to_port:'return'},
  {id:'c_s3_vl',from:'combined_s3',from_port:'flow',to:'combined_buffer',to_port:'top_in'},
  {id:'c_s3_rl',from:'combined_buffer',from_port:'bottom_out',to:'combined_s3',to_port:'return'},
  {id:'c_hk_vl',from:'combined_buffer',from_port:'top_out',to:'combined_hk',to_port:'flow_in'},
  {id:'c_hk_rl',from:'combined_hk',from_port:'return_out',to:'combined_buffer',to_port:'bottom_in'}
]});
const combinedHass=hass({
  'sensor.combined_oil_vl':[71,'°C'],
  'sensor.combined_s3_vl':[77,'°C'],'sensor.combined_s3_rl':[52,'°C'],
  'sensor.combined_buffer_top':[75,'°C'],'sensor.combined_buffer_bottom':[43,'°C'],
  'sensor.combined_hk_flow':[41.7,'°C'],'sensor.combined_hk_return':[33,'°C'],
  'switch.combined_s3':'on','switch.combined_hk':'on'
});
const combinedLayout=HPC_INTEGRATED.layout(combinedPlan);
const oilPort=HPC_INTEGRATED.port(combinedPlan.components[0],
  combinedLayout.anchored.get('combined_oil'),'return');
const s3Port=HPC_INTEGRATED.port(combinedPlan.components[1],
  combinedLayout.points.get('combined_s3'),'return');
check(oilPort.x===240&&Math.abs(s3Port.x-(52+238*350/540))<.01,
  'Oil and secondary S3 return ports reach their physical cabinet edges');
const combinedRender=HPC_INTEGRATED.svg(combinedLayout,combinedHass);
const combinedSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
combinedSvg.innerHTML=combinedRender.body;
const combinedReturn=combinedSvg.querySelector('[data-hpi-edge="c_s3_rl"]');
const combinedSegments=[...(combinedReturn?.querySelectorAll('path.pipe')||[])];
check(combinedSegments.length>=3&&
  combinedSegments.at(-1)?.style.getPropertyValue('--pc')===
    HPC_FREE.color({number:52,unit:'°C'}),
  'RLA mixed return has measured return colour, unlike cool buffer return');
check(combinedSvg.querySelector('[data-hpi-node="combined_s3"] rect.unit')===null&&
  !!combinedSvg.querySelector('[data-hpi-node="combined_s3"] .hpi-generator-title'),
  'Secondary S3 alone has no outer frame and has a readable caption');
const extraFrame=HPC_FREE.normalize({components:[
  {id:'frame_s3',type:'wood_gasifier',options:{froeling_view:'s3_turbo'}},
  {id:'frame_oil',type:'oil_boiler'}],connections:[]});
const extraSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
extraSvg.innerHTML=HPC_INTEGRATED.svg(HPC_INTEGRATED.layout(extraFrame),hass()).body;
check(!!extraSvg.querySelector('[data-hpi-node="frame_oil"] rect.unit')&&
  !extraSvg.querySelector('[data-hpi-node="frame_s3"] rect.unit'),
  'Only S3 artwork is frameless, other heat sources keep their unit frame');
check(!combinedSvg.querySelector('.hpi-froeling text[x="356"]'),
  'No duplicated VL/RL captions inside S3 artwork');
check(combinedRender.nativePipes.combined_hk.flow.colored[0].color===
  HPC_FREE.color({number:75,unit:'°C'})&&
  combinedRender.nativePipes.combined_hk.flow.colored.at(-1).color===
  HPC_FREE.color({number:41.7,unit:'°C'}),
  'Hot buffer water reaches heating mixer, actual flow temperature follows it');

document.querySelector('#result').textContent=checks.every(line=>line.startsWith('OK'))?'PASS':'FAIL';
document.querySelector('#log').textContent=checks.join('\n');
</script></body></html>
